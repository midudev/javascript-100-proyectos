<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23 - Visualizador de ordenación</title>
  <style>
    :root {
      --bg: #070910;
      --surface: #0f1320;
      --surface-2: #161b2c;
      --border: #222a40;
      --text: #e7e9f3;
      --muted: #8a92ad;
      --accent: #818cf8;
      --compare: #facc15;
      --swap: #f43f5e;
      --pivot: #fb923c;
      --sorted: #22c55e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    h1 {
      margin: 0 6px 0 0;
      font-size: 1rem;
      white-space: nowrap;
    }

    select,
    button {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 0.88rem;
      white-space: nowrap;
      cursor: pointer;
    }

    button:hover,
    select:hover {
      border-color: var(--accent);
    }

    #play {
      min-width: 118px;
      border-color: var(--accent);
      background: var(--accent);
      color: #1e1b4b;
      font-weight: 700;
    }

    #sound[aria-pressed='true'] {
      border-color: var(--accent);
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    label output {
      min-width: 3ch;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }

    input[type='range'] {
      width: 80px;
      accent-color: var(--accent);
    }

    .group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .stage {
      position: relative;
      flex: 1;
      min-height: 0;
      padding: 16px 16px 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .info {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: min(420px, calc(100% - 32px));
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(15, 19, 32, 0.88);
      backdrop-filter: blur(6px);
      pointer-events: none;
    }

    .info h2 {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 4px;
      font-size: 0.95rem;
    }

    .info h2 span {
      color: var(--accent);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 0.85rem;
    }

    .info p {
      margin: 0 0 10px;
      font-size: 0.82rem;
      line-height: 1.45;
      color: var(--muted);
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .stats strong {
      color: var(--text);
    }

    .legend {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      max-width: 260px;
      justify-content: flex-end;
      font-size: 0.75rem;
      color: var(--muted);
      pointer-events: none;
    }

    .legend span::before {
      content: '';
      display: inline-block;
      width: 9px;
      height: 9px;
      margin-right: 5px;
      border-radius: 2px;
      background: var(--color);
    }

    @media (max-width: 640px) {
      .legend {
        display: none;
      }
    }
  </style>

  <script type="module">
    const canvas = document.querySelector('canvas')
    const context = canvas.getContext('2d')
    const $algorithm = document.querySelector('#algorithm')
    const $size = document.querySelector('#size')
    const $sizeOutput = document.querySelector('#size-output')
    const $speed = document.querySelector('#speed')
    const $speedOutput = document.querySelector('#speed-output')
    const $play = document.querySelector('#play')
    const $step = document.querySelector('#step')
    const $shuffle = document.querySelector('#shuffle')
    const $sound = document.querySelector('#sound')
    const $infoTitle = document.querySelector('.info h2')
    const $infoText = document.querySelector('.info p')
    const $comparisons = document.querySelector('#comparisons')
    const $swaps = document.querySelector('#swaps')
    const $writes = document.querySelector('#writes')

    // CONSTANTES
    const MAX_STEPS_PER_FRAME = 400
    const COLORS = {
      compare: '#facc15',
      swap: '#f43f5e',
      pivot: '#fb923c'
    }

    // ALGORITMOS COMO GENERADORES
    // Una función generadora (function*) se puede PAUSAR en cada `yield` y
    // continuar después, justo donde se quedó, al llamar a .next().
    // Así escribimos cada algoritmo de forma natural (con sus bucles y su
    // recursión) y aun así podemos ejecutarlo paso a paso: cada yield describe
    // lo que acaba de pasar (una comparación, un intercambio...) para dibujarlo

    function swap(array, i, j) {
      const temp = array[i]
      array[i] = array[j]
      array[j] = temp
    }

    function* bubbleSort(array) {
      for (let end = array.length - 1; end > 0; end--) {
        let hasSwapped = false

        for (let i = 0; i < end; i++) {
          yield { type: 'compare', i, j: i + 1 }
          if (array[i] > array[i + 1]) {
            swap(array, i, i + 1)
            hasSwapped = true
            yield { type: 'swap', i, j: i + 1 }
          }
        }

        yield { type: 'sorted', i: end } // el mayor ya ha "burbujeado" hasta el final
        if (!hasSwapped) return // si no hubo intercambios, ya está ordenado
      }
    }

    function* selectionSort(array) {
      for (let i = 0; i < array.length - 1; i++) {
        let min = i

        for (let j = i + 1; j < array.length; j++) {
          yield { type: 'compare', i: min, j }
          if (array[j] < array[min]) min = j
        }

        if (min !== i) {
          swap(array, i, min)
          yield { type: 'swap', i, j: min }
        }
        yield { type: 'sorted', i }
      }
    }

    function* insertionSort(array) {
      for (let i = 1; i < array.length; i++) {
        // Desplazamos el elemento hacia la izquierda mientras sea menor que su vecino
        for (let j = i; j > 0; j--) {
          yield { type: 'compare', i: j - 1, j }
          if (array[j - 1] <= array[j]) break
          swap(array, j - 1, j)
          yield { type: 'swap', i: j - 1, j }
        }
      }
    }

    // yield* delega en otro generador: todos sus yield "suben" hasta nosotros.
    // Es lo que permite usar recursión dentro de un generador
    function* mergeSort(array, low = 0, high = array.length - 1) {
      if (low >= high) return
      const middle = Math.floor((low + high) / 2)
      yield* mergeSort(array, low, middle)
      yield* mergeSort(array, middle + 1, high)
      yield* merge(array, low, middle, high)
    }

    function* merge(array, low, middle, high) {
      const left = array.slice(low, middle + 1)
      const right = array.slice(middle + 1, high + 1)
      let i = 0
      let j = 0
      let k = low

      while (i < left.length && j < right.length) {
        yield { type: 'compare', i: k, j: middle + 1 + j }
        array[k] = left[i] <= right[j] ? left[i++] : right[j++]
        yield { type: 'write', i: k }
        k++
      }

      // Los que quedan de la izquierda se copian. Los de la derecha ya están en su sitio
      while (i < left.length) {
        array[k] = left[i++]
        yield { type: 'write', i: k }
        k++
      }
    }

    function* quickSort(array, low = 0, high = array.length - 1) {
      if (low > high) return
      if (low === high) {
        yield { type: 'sorted', i: low }
        return
      }

      // yield* también devuelve el valor de `return` del generador delegado
      const pivotIndex = yield* partition(array, low, high)
      yield { type: 'sorted', i: pivotIndex }

      yield* quickSort(array, low, pivotIndex - 1)
      yield* quickSort(array, pivotIndex + 1, high)
    }

    // Partición de Lomuto. Usamos el elemento central como pivote para
    // evitar el peor caso O(n²) con arrays ya ordenados
    function* partition(array, low, high) {
      const middle = Math.floor((low + high) / 2)
      swap(array, middle, high)
      yield { type: 'swap', i: middle, j: high }

      const pivot = array[high]
      let store = low

      for (let i = low; i < high; i++) {
        yield { type: 'compare', i, j: store, pivot: high }
        if (array[i] < pivot) {
          if (i !== store) {
            swap(array, i, store)
            yield { type: 'swap', i, j: store }
          }
          store++
        }
      }

      swap(array, store, high)
      yield { type: 'swap', i: store, j: high }
      return store
    }

    function* heapSort(array) {
      const size = array.length

      // 1. Construimos un max-heap: cada padre es mayor que sus hijos
      for (let i = Math.floor(size / 2) - 1; i >= 0; i--) {
        yield* siftDown(array, i, size)
      }

      // 2. La raíz es el máximo: la mandamos al final y reparamos el heap
      for (let end = size - 1; end > 0; end--) {
        swap(array, 0, end)
        yield { type: 'swap', i: 0, j: end }
        yield { type: 'sorted', i: end }
        yield* siftDown(array, 0, end)
      }
    }

    function* siftDown(array, root, size) {
      while (true) {
        const left = 2 * root + 1
        const right = left + 1
        let largest = root

        if (left >= size) return

        yield { type: 'compare', i: left, j: largest }
        if (array[left] > array[largest]) largest = left

        if (right < size) {
          yield { type: 'compare', i: right, j: largest }
          if (array[right] > array[largest]) largest = right
        }

        if (largest === root) return

        swap(array, root, largest)
        yield { type: 'swap', i: root, j: largest }
        root = largest
      }
    }

    const ALGORITHMS = {
      bubble: {
        name: 'Bubble sort',
        complexity: 'O(n²)',
        description: 'Compara parejas de vecinos y los intercambia si están desordenados. En cada pasada el mayor “burbujea” hasta el final.',
        generator: bubbleSort
      },
      selection: {
        name: 'Selection sort',
        complexity: 'O(n²)',
        description: 'Busca el mínimo de la parte sin ordenar y lo coloca al principio. Hace muy pocos intercambios, pero muchísimas comparaciones.',
        generator: selectionSort
      },
      insertion: {
        name: 'Insertion sort',
        complexity: 'O(n²)',
        description: 'Coge cada elemento y lo desplaza a la izquierda hasta su sitio, como cuando ordenas las cartas en la mano. Rapidísimo si el array está casi ordenado.',
        generator: insertionSort
      },
      merge: {
        name: 'Merge sort',
        complexity: 'O(n log n)',
        description: 'Divide el array en mitades, ordena cada mitad de forma recursiva y después las mezcla. Estable y siempre rápido, pero usa memoria extra.',
        generator: mergeSort
      },
      quick: {
        name: 'Quick sort',
        complexity: 'O(n log n) de media',
        description: 'Elige un pivote (naranja), deja los menores a su izquierda y los mayores a su derecha, y repite en cada lado. Suele ser el más rápido en la práctica.',
        generator: quickSort
      },
      heap: {
        name: 'Heap sort',
        complexity: 'O(n log n)',
        description: 'Organiza el array como un montículo (heap) donde la raíz es el máximo, lo manda al final y repite. No necesita memoria extra.',
        generator: heapSort
      }
    }

    // ESTADO
    let initialValues = []
    let values = []
    let sortedMask = new Uint8Array(0)
    let highlights = new Map()
    let generator = null
    let status = 'idle' // 'idle' | 'running' | 'paused' | 'done'
    let runId = 0
    let resumeRun = null
    let stats = { comparisons: 0, swaps: 0, writes: 0 }
    let audioContext = null

    // DATOS
    function createShuffledValues(size) {
      // Valores 1..n sin repetir, barajados con Fisher-Yates
      const result = Array.from({ length: size }, (_, index) => index + 1)
      for (let i = result.length - 1; i > 0; i--) {
        swap(result, i, Math.floor(Math.random() * (i + 1)))
      }
      return result
    }

    function newArray() {
      initialValues = createShuffledValues(Number($size.value))
      reset()
    }

    // Vuelve al array inicial: así puedes comparar algoritmos con los mismos datos
    function reset() {
      cancelRun()
      values = [...initialValues]
      sortedMask = new Uint8Array(values.length)
      highlights = new Map()
      generator = null
      stats = { comparisons: 0, swaps: 0, writes: 0 }
      setStatus('idle')
      renderStats()
      draw()
    }

    // BUCLE DE ANIMACIÓN CON ASYNC/AWAIT
    // requestAnimationFrame y la pausa se envuelven en promesas para poder
    // escribir el bucle como código secuencial con await
    function nextFrame() {
      return new Promise((resolve) => window.requestAnimationFrame(resolve))
    }

    function waitForResume() {
      return new Promise((resolve) => { resumeRun = resolve })
    }

    function getOpsPerSecond() {
      // Escala exponencial: el slider cubre desde 2 hasta miles de pasos por segundo
      return Math.round(2 * 1.1 ** Number($speed.value))
    }

    async function run() {
      const id = ++runId
      let lastTime = performance.now()
      let budget = 0

      while (true) {
        if (status === 'paused') {
          await waitForResume()
          lastTime = performance.now()
        }

        const now = await nextFrame()
        if (id !== runId) return // alguien canceló esta ejecución (nuevo array, otro algoritmo...)
        if (status === 'paused') continue

        // Cuántos pasos tocan en este frame según el tiempo transcurrido
        budget += ((now - lastTime) / 1000) * getOpsPerSecond()
        budget = Math.min(budget, MAX_STEPS_PER_FRAME)
        lastTime = now

        let lastOperation = null
        while (budget >= 1) {
          const { value, done } = generator.next()
          if (done) {
            await finish(id)
            return
          }
          applyOperation(value)
          lastOperation = value
          budget--
        }

        if (lastOperation) {
          renderStats()
          draw()
          playTone(lastOperation)
        }
      }
    }

    function cancelRun() {
      runId++ // cualquier run() anterior verá que su id ya no coincide y terminará
      resumeRun?.()
      resumeRun = null
    }

    async function finish(id) {
      highlights = new Map()
      // Barrido final en verde para celebrar 🎉
      const perFrame = Math.max(1, Math.ceil(values.length / 40))
      for (let i = 0; i < values.length; i++) {
        sortedMask[i] = 1
        if (i % perFrame === 0) {
          draw()
          playTone({ type: 'sorted', i })
          await nextFrame()
          if (id !== runId) return
        }
      }
      draw()
      setStatus('done')
    }

    function applyOperation(operation) {
      highlights = new Map()
      const { type, i, j, pivot } = operation

      if (type === 'compare') {
        stats.comparisons++
        highlights.set(i, COLORS.compare)
        highlights.set(j, COLORS.compare)
        if (pivot !== undefined) highlights.set(pivot, COLORS.pivot)
      } else if (type === 'swap') {
        stats.swaps++
        highlights.set(i, COLORS.swap)
        highlights.set(j, COLORS.swap)
      } else if (type === 'write') {
        stats.writes++
        highlights.set(i, COLORS.swap)
      } else if (type === 'sorted') {
        sortedMask[i] = 1
      }
    }

    // CONTROLES
    function setStatus(newStatus) {
      status = newStatus
      const labels = {
        idle: '▶ Ordenar',
        running: '⏸ Pausa',
        paused: '▶ Continuar',
        done: '↺ Reiniciar'
      }
      $play.textContent = labels[status]
      $step.disabled = status === 'done'
    }

    function start() {
      generator = ALGORITHMS[$algorithm.value].generator(values)
      setStatus('running')
      run()
    }

    function togglePlay() {
      if (status === 'idle') {
        start()
      } else if (status === 'running') {
        setStatus('paused')
      } else if (status === 'paused') {
        setStatus('running')
        resumeRun?.()
        resumeRun = null
      } else {
        reset()
      }
    }

    function stepOnce() {
      if (status === 'done') return
      if (status === 'idle') {
        start()
        setStatus('paused')
      } else if (status === 'running') {
        setStatus('paused')
      }

      // Avanzamos el generador hasta la siguiente comparación/intercambio visible
      let result = generator.next()
      while (!result.done && result.value.type === 'sorted') {
        applyOperation(result.value)
        result = generator.next()
      }

      if (result.done) {
        // Cancelamos el run() que esperaba en pausa y lanzamos el barrido final
        cancelRun()
        finish(runId)
        return
      }

      applyOperation(result.value)
      renderStats()
      draw()
      playTone(result.value)
    }

    // SONIDO
    function toggleSound() {
      const isOn = $sound.getAttribute('aria-pressed') !== 'true'
      $sound.setAttribute('aria-pressed', String(isOn))
      $sound.textContent = isOn ? '🔊 Sonido' : '🔇 Sonido'

      // El AudioContext se crea tras un clic del usuario (política de autoplay)
      if (isOn) {
        audioContext ??= new AudioContext()
        audioContext.resume()
      }
    }

    function playTone(operation) {
      if (!audioContext || $sound.getAttribute('aria-pressed') !== 'true') return

      // La altura de la barra se traduce en frecuencia: barras altas = notas agudas
      const value = values[operation.i] ?? 1
      const frequency = 160 + (value / values.length) * 900
      const time = audioContext.currentTime

      const oscillator = audioContext.createOscillator()
      const gain = audioContext.createGain()
      oscillator.type = 'triangle'
      oscillator.frequency.value = frequency
      gain.gain.setValueAtTime(0.06, time)
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.09)
      oscillator.connect(gain).connect(audioContext.destination)
      oscillator.start(time)
      oscillator.stop(time + 0.1)
    }

    // DIBUJO
    function resizeCanvas() {
      const { width, height } = canvas.getBoundingClientRect()
      const ratio = window.devicePixelRatio || 1
      canvas.width = Math.round(width * ratio)
      canvas.height = Math.round(height * ratio)
      context.setTransform(ratio, 0, 0, ratio, 0, 0)
      draw()
    }

    function getBarColor(index) {
      if (highlights.has(index)) return highlights.get(index)

      const progress = values[index] / values.length
      if (sortedMask[index]) return `hsl(${140 + progress * 30} 70% ${42 + progress * 18}%)`
      return `hsl(${215 + progress * 70} 75% ${48 + progress * 20}%)`
    }

    function draw() {
      const width = canvas.width / (window.devicePixelRatio || 1)
      const height = canvas.height / (window.devicePixelRatio || 1)
      const count = values.length
      if (count === 0) return

      context.clearRect(0, 0, width, height)

      const topSpace = Math.min(150, height * 0.3) // hueco para el panel de información
      const barWidth = width / count
      const gap = barWidth > 6 ? 2 : barWidth > 3 ? 1 : 0
      const radius = Math.min(4, (barWidth - gap) / 2)

      for (let i = 0; i < count; i++) {
        const barHeight = (values[i] / count) * (height - topSpace)
        const x = i * barWidth + gap / 2
        const y = height - barHeight

        context.fillStyle = getBarColor(i)
        context.beginPath()
        context.roundRect(x, y, barWidth - gap, barHeight, [radius, radius, 0, 0])
        context.fill()
      }
    }

    function renderStats() {
      $comparisons.textContent = stats.comparisons.toLocaleString('es')
      $swaps.textContent = stats.swaps.toLocaleString('es')
      $writes.textContent = stats.writes.toLocaleString('es')
    }

    function renderInfo() {
      const { name, complexity, description } = ALGORITHMS[$algorithm.value]
      $infoTitle.innerHTML = `${name} <span>${complexity}</span>`
      $infoText.textContent = description
    }

    // EVENTOS
    $play.addEventListener('click', togglePlay)
    $step.addEventListener('click', stepOnce)
    $shuffle.addEventListener('click', newArray)
    $sound.addEventListener('click', toggleSound)

    $algorithm.addEventListener('change', () => {
      renderInfo()
      reset()
    })

    $size.addEventListener('input', () => {
      $sizeOutput.textContent = $size.value
      newArray()
    })

    $speed.addEventListener('input', () => {
      $speedOutput.textContent = `${getOpsPerSecond().toLocaleString('es')}/s`
    })

    document.addEventListener('keydown', (event) => {
      if (event.target instanceof HTMLSelectElement || event.target instanceof HTMLInputElement) return
      if (event.code === 'Space') {
        event.preventDefault()
        togglePlay()
      }
    })

    new ResizeObserver(resizeCanvas).observe(canvas)

    $sizeOutput.textContent = $size.value
    $speedOutput.textContent = `${getOpsPerSecond().toLocaleString('es')}/s`
    renderInfo()
    newArray()
  </script>
</head>

<body>
  <header>
    <h1>📊 Visualizador de ordenación</h1>

    <select id="algorithm" aria-label="Algoritmo">
      <option value="bubble">Bubble sort</option>
      <option value="selection">Selection sort</option>
      <option value="insertion">Insertion sort</option>
      <option value="merge">Merge sort</option>
      <option value="quick" selected>Quick sort</option>
      <option value="heap">Heap sort</option>
    </select>

    <div class="group">
      <button id="play">▶ Ordenar</button>
      <button id="step" title="Un paso">⏭ Paso</button>
      <button id="shuffle" title="Generar otro array">🔀 Nuevo</button>
      <button id="sound" aria-pressed="false">🔇 Sonido</button>
    </div>

    <label>Barras <input id="size" type="range" min="10" max="200" value="60"> <output id="size-output"></output></label>
    <label>Velocidad <input id="speed" type="range" min="1" max="100" value="55"> <output id="speed-output"></output></label>
  </header>

  <main class="stage">
    <canvas aria-label="Barras del array"></canvas>

    <section class="info">
      <h2></h2>
      <p></p>
      <div class="stats">
        <span>Comparaciones <strong id="comparisons">0</strong></span>
        <span>Intercambios <strong id="swaps">0</strong></span>
        <span>Escrituras <strong id="writes">0</strong></span>
      </div>
    </section>

    <div class="legend">
      <span style="--color: var(--compare)">Comparación</span>
      <span style="--color: var(--swap)">Intercambio</span>
      <span style="--color: var(--pivot)">Pivote</span>
      <span style="--color: var(--sorted)">Ordenado</span>
    </div>
  </main>
</body>

</html>
