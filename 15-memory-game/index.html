<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 - Juego de memoria</title>
  <style>
    :root {
      --bg: #f5f3ff;
      --surface: #ffffff;
      --text: #1e1b4b;
      --muted: #6b7280;
      --primary: #7c3aed;
      --primary-soft: #ede9fe;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 0% 0%, #e0e7ff, transparent 45%),
        radial-gradient(circle at 100% 100%, #fce7f3, transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    main {
      width: min(100%, 640px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }

    header {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: -0.02em;
    }

    .difficulty {
      display: flex;
      padding: 4px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(30, 27, 75, 0.1);
    }

    .difficulty button {
      padding: 6px 14px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .difficulty button[aria-pressed='true'] {
      background: var(--primary);
      color: white;
    }

    .stats {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .stat {
      flex: 1;
      padding: 8px 12px;
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(30, 27, 75, 0.08);
      text-align: center;
    }

    .stat small {
      display: block;
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .stat strong {
      font-size: 1.2rem;
      font-variant-numeric: tabular-nums;
    }

    .restart {
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: var(--primary-soft);
      color: var(--primary);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .board {
      --size: min(100%, calc(100dvh - 190px));
      width: var(--size);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(var(--cols), 1fr);
      grid-auto-rows: 1fr;
      gap: clamp(6px, 1.5vw, 12px);
    }

    /* --- Carta con transformaciones 3D --- */
    .card {
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      /* perspective crea la sensación de profundidad: cuanto menor, más exagerado el efecto */
      perspective: 800px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
      /* preserve-3d hace que los hijos vivan en el mismo espacio 3D que el padre */
      transform-style: preserve-3d;
    }

    .card.is-flipped .card-inner,
    .card.is-matched .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: clamp(8px, 2vw, 14px);
      /* Ocultamos la cara que queda de espaldas al usuario */
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .face-back {
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.35), transparent 40%),
        linear-gradient(135deg, #8b5cf6, #6366f1);
      box-shadow: 0 4px 10px -2px rgba(99, 102, 241, 0.45);
      color: rgba(255, 255, 255, 0.85);
      font-size: calc(var(--card-font) * 0.6);
      font-weight: 800;
    }

    /* La cara frontal empieza girada 180º, así queda oculta hasta que volteamos la carta */
    .face-front {
      transform: rotateY(180deg);
      background: var(--surface);
      box-shadow: 0 4px 10px -2px rgba(30, 27, 75, 0.15);
      font-size: var(--card-font);
    }

    .card:hover:not(.is-flipped, .is-matched) .card-inner {
      transform: rotateY(12deg) scale(1.03);
    }

    .card.is-matched .face-front {
      background: #d1fae5;
      box-shadow: 0 0 0 3px var(--success);
      animation: pop 0.4s ease 0.3s;
    }

    .card.is-wrong .face-front {
      animation: shake 0.4s ease 0.3s;
    }

    @keyframes pop {
      50% {
        transform: rotateY(180deg) scale(1.1);
      }
    }

    @keyframes shake {

      25%,
      75% {
        transform: rotateY(180deg) translateX(-4px);
      }

      50% {
        transform: rotateY(180deg) translateX(4px);
      }
    }

    .card:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
      border-radius: 12px;
    }

    /* --- Victoria --- */
    dialog {
      border: 0;
      border-radius: 20px;
      padding: 28px 32px;
      text-align: center;
      color: var(--text);
      box-shadow: 0 30px 60px -15px rgba(30, 27, 75, 0.4);
    }

    dialog::backdrop {
      background: rgba(30, 27, 75, 0.35);
      backdrop-filter: blur(3px);
    }

    dialog h2 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    dialog p {
      margin: 6px 0;
      color: var(--muted);
    }

    dialog button {
      margin-top: 14px;
      padding: 12px 24px;
      border: 0;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
  </style>

  <script type="module">
    const $board = document.querySelector('.board')
    const $moves = document.querySelector('#moves')
    const $pairs = document.querySelector('#pairs')
    const $time = document.querySelector('#time')
    const $best = document.querySelector('#best')
    const $restart = document.querySelector('.restart')
    const $difficultyButtons = document.querySelectorAll('.difficulty button')
    const $dialog = document.querySelector('dialog')
    const $dialogText = $dialog.querySelector('p')

    // CONSTANTES
    const EMOJIS = [
      '🐶', '🐱', '🦊', '🐼', '🐸', '🐵', '🦁', '🐯', '🐨',
      '🐷', '🐙', '🦄', '🐝', '🦋', '🐢', '🐳', '🦉', '🐧'
    ]
    const MISMATCH_DELAY = 900 // ms que se muestran dos cartas distintas
    const BEST_KEY = 'memory-best'

    // ESTADO
    let size = 4
    let firstCard = null
    let secondCard = null
    let isBoardLocked = false
    let moves = 0
    let matchedPairs = 0
    let startTime = 0
    let timerId = null
    let mismatchTimeoutId = null
    let winTimeoutId = null

    // Algoritmo de Fisher-Yates (o de Knuth):
    // recorremos el array de atrás hacia delante y en cada posición `i`
    // intercambiamos el elemento con otro elegido al azar entre 0 e `i`.
    // Así cada permutación posible tiene EXACTAMENTE la misma probabilidad.
    // El típico `array.sort(() => Math.random() - 0.5)` NO es uniforme:
    // depende del algoritmo de ordenación y produce barajados sesgados.
    function shuffle(array) {
      const result = [...array]

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1))
        const temp = result[i]
        result[i] = result[j]
        result[j] = temp
      }

      return result
    }

    function createDeck(pairs) {
      // Elegimos emojis al azar y duplicamos cada uno para formar parejas
      const chosen = shuffle(EMOJIS).slice(0, pairs)
      return shuffle([...chosen, ...chosen])
    }

    function createCard(emoji) {
      const $card = document.createElement('button')
      $card.className = 'card'
      $card.dataset.emoji = emoji
      $card.setAttribute('aria-label', 'Carta boca abajo')
      $card.innerHTML = `
        <div class="card-inner">
          <div class="face face-back">?</div>
          <div class="face face-front">${emoji}</div>
        </div>
      `
      return $card
    }

    function startGame() {
      clearTimeout(mismatchTimeoutId)
      clearTimeout(winTimeoutId)
      stopTimer()

      firstCard = null
      secondCard = null
      isBoardLocked = false
      moves = 0
      matchedPairs = 0
      startTime = 0

      const pairs = (size * size) / 2
      const deck = createDeck(pairs)

      $board.style.setProperty('--cols', size)
      // El tamaño del emoji depende del número de columnas
      $board.style.setProperty('--card-font', size === 4 ? 'clamp(28px, 8vw, 56px)' : 'clamp(20px, 5vw, 38px)')
      $board.replaceChildren(...deck.map(createCard))

      updateStats()
      $time.textContent = '00:00'
    }

    function flipCard($card) {
      if (isBoardLocked) return
      if ($card === firstCard) return
      if ($card.classList.contains('is-matched')) return

      // El cronómetro arranca con la primera carta volteada
      if (!startTime) startTimer()

      $card.classList.add('is-flipped')
      $card.setAttribute('aria-label', `Carta ${$card.dataset.emoji}`)

      if (!firstCard) {
        firstCard = $card
        return
      }

      secondCard = $card
      moves++
      checkForMatch()
    }

    function checkForMatch() {
      const isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji

      if (isMatch) {
        firstCard.classList.add('is-matched')
        secondCard.classList.add('is-matched')
        firstCard.disabled = true
        secondCard.disabled = true
        matchedPairs++
        resetTurn()
        updateStats()

        if (matchedPairs === (size * size) / 2) win()
        return
      }

      // Bloqueamos el tablero mientras se muestran las dos cartas.
      // Sin este bloqueo el jugador podría voltear una tercera carta
      // antes de que las dos anteriores vuelvan a ocultarse
      isBoardLocked = true
      firstCard.classList.add('is-wrong')
      secondCard.classList.add('is-wrong')
      updateStats()

      mismatchTimeoutId = setTimeout(() => {
        for (const $card of [firstCard, secondCard]) {
          $card.classList.remove('is-flipped', 'is-wrong')
          $card.setAttribute('aria-label', 'Carta boca abajo')
        }
        resetTurn()
      }, MISMATCH_DELAY)
    }

    function resetTurn() {
      firstCard = null
      secondCard = null
      isBoardLocked = false
    }

    // TEMPORIZADOR
    // setInterval no es exacto (puede retrasarse), así que no contamos
    // "ticks": calculamos el tiempo transcurrido desde startTime
    function startTimer() {
      startTime = Date.now()
      timerId = setInterval(renderTime, 250)
    }

    function stopTimer() {
      clearInterval(timerId)
      timerId = null
    }

    function getElapsedSeconds() {
      return startTime ? Math.floor((Date.now() - startTime) / 1000) : 0
    }

    function formatTime(totalSeconds) {
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0')
      const seconds = String(totalSeconds % 60).padStart(2, '0')
      return `${minutes}:${seconds}`
    }

    function renderTime() {
      $time.textContent = formatTime(getElapsedSeconds())
    }

    function updateStats() {
      $moves.textContent = moves
      $pairs.textContent = `${matchedPairs}/${(size * size) / 2}`
      const best = readBest()[size]
      $best.textContent = best ? `${best.moves} mov.` : '—'
    }

    // RÉCORDS (localStorage)
    function readBest() {
      try {
        return JSON.parse(localStorage.getItem(BEST_KEY)) ?? {}
      } catch {
        return {}
      }
    }

    function saveBest(result) {
      const best = readBest()
      const previous = best[size]
      const isBetter = !previous ||
        result.moves < previous.moves ||
        (result.moves === previous.moves && result.seconds < previous.seconds)

      if (!isBetter) return false

      best[size] = result
      try {
        localStorage.setItem(BEST_KEY, JSON.stringify(best))
      } catch {
        // almacenamiento no disponible
      }
      return true
    }

    function win() {
      stopTimer()
      renderTime()

      const seconds = getElapsedSeconds()
      const isRecord = saveBest({ moves, seconds })
      updateStats()

      $dialogText.innerHTML = `
        Has encontrado todas las parejas en <strong>${moves} movimientos</strong>
        y <strong>${formatTime(seconds)}</strong>.
        ${isRecord ? '<br>🏆 ¡Nuevo récord!' : ''}
      `
      // Esperamos a que termine la animación de la última pareja
      winTimeoutId = setTimeout(() => $dialog.showModal(), 700)
    }

    // EVENTOS
    // Delegación de eventos: un único listener en el tablero
    $board.addEventListener('click', (event) => {
      const $card = event.target.closest('.card')
      if ($card) flipCard($card)
    })

    $difficultyButtons.forEach(($button) => {
      $button.addEventListener('click', () => {
        size = Number($button.dataset.size)
        $difficultyButtons.forEach(($b) => $b.setAttribute('aria-pressed', String($b === $button)))
        startGame()
      })
    })

    $restart.addEventListener('click', startGame)

    $dialog.addEventListener('close', startGame)

    startGame()
  </script>
</head>

<body>
  <main>
    <header>
      <h1>🧠 Juego de memoria</h1>
      <div class="difficulty" role="group" aria-label="Dificultad">
        <button data-size="4" aria-pressed="true">4 × 4</button>
        <button data-size="6" aria-pressed="false">6 × 6</button>
      </div>
    </header>

    <section class="stats">
      <div class="stat"><small>Movimientos</small><strong id="moves">0</strong></div>
      <div class="stat"><small>Parejas</small><strong id="pairs">0/8</strong></div>
      <div class="stat"><small>Tiempo</small><strong id="time">00:00</strong></div>
      <div class="stat"><small>Récord</small><strong id="best">—</strong></div>
      <button class="restart" title="Reiniciar partida">↻</button>
    </section>

    <section class="board" style="--cols: 4"></section>
  </main>

  <dialog>
    <h2>🎉 ¡Enhorabuena!</h2>
    <p></p>
    <form method="dialog">
      <button>Jugar otra vez</button>
    </form>
  </dialog>
</body>

</html>
