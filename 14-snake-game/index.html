<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>14 - Snake</title>
  <style>
    :root {
      --bg: #070b16;
      --panel: #0f172a;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #4ade80;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 10%, rgba(74, 222, 128, 0.12), transparent 40%),
        radial-gradient(circle at 80% 90%, rgba(56, 189, 248, 0.1), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 16px;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--accent);
    }

    .scores {
      display: flex;
      gap: 10px;
    }

    .score {
      min-width: 88px;
      padding: 6px 12px;
      border-radius: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      text-align: center;
    }

    .score small {
      display: block;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .score strong {
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
    }

    .score.bump strong {
      animation: bump 0.25s ease;
    }

    @keyframes bump {
      50% {
        transform: scale(1.3);
        color: var(--accent);
      }
    }

    .board {
      position: relative;
      width: min(92vw, calc(100dvh - 150px), 580px);
      aspect-ratio: 1;
      border-radius: 18px;
      box-shadow: 0 0 0 1px var(--border), 0 30px 80px -20px rgba(74, 222, 128, 0.25);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      text-align: center;
      border-radius: 18px;
      background: rgba(7, 11, 22, 0.35);
    }

    .card {
      display: grid;
      gap: 12px;
      max-width: 360px;
      padding: 24px 28px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.88);
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6);
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay h2 {
      margin: 0;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
    }

    .overlay p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .overlay.is-over h2 {
      color: var(--danger);
    }

    button {
      justify-self: center;
      margin-top: 6px;
      padding: 12px 26px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #052e16;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    kbd {
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--panel);
      font-size: 0.8em;
    }

    .hint {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
  </style>

  <script type="module">
    const canvas = document.querySelector('canvas')
    const context = canvas.getContext('2d')

    const $score = document.querySelector('#score')
    const $record = document.querySelector('#record')
    const $overlay = document.querySelector('.overlay')
    const $overlayTitle = $overlay.querySelector('h2')
    const $overlayText = $overlay.querySelector('p')
    const $overlayButton = $overlay.querySelector('button')

    // CONSTANTES
    const COLS = 20
    const ROWS = 20
    const INITIAL_LENGTH = 4
    const INITIAL_SPEED = 7 // pasos por segundo
    const MAX_SPEED = 20
    const SPEED_PER_FOOD = 0.5
    const MAX_QUEUED_DIRECTIONS = 3
    const SWIPE_THRESHOLD = 24 // píxeles mínimos para considerar un swipe
    const RECORD_KEY = 'snake-record'

    const STATES = {
      READY: 'ready',
      PLAYING: 'playing',
      PAUSED: 'paused',
      OVER: 'over'
    }

    const DIRECTIONS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    }

    const OPPOSITE = {
      up: 'down',
      down: 'up',
      left: 'right',
      right: 'left'
    }

    // Usamos event.code (posición física de la tecla) para que WASD
    // funcione igual en cualquier distribución de teclado
    const KEY_TO_DIRECTION = {
      ArrowUp: 'up',
      ArrowDown: 'down',
      ArrowLeft: 'left',
      ArrowRight: 'right',
      KeyW: 'up',
      KeyS: 'down',
      KeyA: 'left',
      KeyD: 'right'
    }

    // ESTADO
    let snake = []
    let direction = 'right'
    let directionQueue = []
    let food = null
    let score = 0
    let record = readRecord()
    let state = STATES.READY
    let lastFrameTime = 0
    let accumulator = 0

    function readRecord() {
      try {
        return Number(localStorage.getItem(RECORD_KEY)) || 0
      } catch {
        return 0
      }
    }

    function saveRecord(value) {
      try {
        localStorage.setItem(RECORD_KEY, String(value))
      } catch {
        // Si el navegador bloquea el almacenamiento, el récord solo vive en memoria
      }
    }

    function resetGame() {
      const startX = Math.floor(COLS / 2) - 2
      const startY = Math.floor(ROWS * 0.8)

      // La serpiente es un array de segmentos: la posición 0 es la cabeza
      snake = Array.from({ length: INITIAL_LENGTH }, (_, index) => ({
        x: startX - index,
        y: startY
      }))

      direction = 'right'
      directionQueue = []
      score = 0
      accumulator = 0
      food = createFood()
      updateScoreboard()
    }

    function createFood() {
      // Buscamos todas las casillas libres y elegimos una al azar.
      // Así nunca aparece comida encima de la serpiente
      const occupied = new Set(snake.map(({ x, y }) => `${x},${y}`))
      const freeCells = []

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (!occupied.has(`${x},${y}`)) freeCells.push({ x, y })
        }
      }

      if (freeCells.length === 0) return null
      return freeCells[Math.floor(Math.random() * freeCells.length)]
    }

    function getSpeed() {
      return Math.min(MAX_SPEED, INITIAL_SPEED + score * SPEED_PER_FOOD)
    }

    // Cola de direcciones: si el jugador pulsa ↑ y ← muy rápido (dentro del
    // mismo tick) no queremos perder la segunda pulsación ni permitir un giro
    // de 180º. Cada nueva dirección se compara con la ÚLTIMA encolada,
    // no con la dirección actual
    function queueDirection(newDirection) {
      const lastDirection = directionQueue.at(-1) ?? direction

      if (newDirection === lastDirection) return
      if (newDirection === OPPOSITE[lastDirection]) return
      if (directionQueue.length >= MAX_QUEUED_DIRECTIONS) return

      directionQueue.push(newDirection)
    }

    function isSameCell(a, b) {
      return a.x === b.x && a.y === b.y
    }

    function isOutside({ x, y }) {
      return x < 0 || y < 0 || x >= COLS || y >= ROWS
    }

    function step() {
      if (directionQueue.length > 0) {
        direction = directionQueue.shift()
      }

      const { x: dx, y: dy } = DIRECTIONS[direction]
      const head = { x: snake[0].x + dx, y: snake[0].y + dy }
      const willEat = food && isSameCell(head, food)

      // Si no come, la cola se moverá en este mismo paso, así que la
      // cabeza SÍ puede entrar en la casilla que ocupa ahora la cola
      const body = willEat ? snake : snake.slice(0, -1)

      if (isOutside(head) || body.some((segment) => isSameCell(segment, head))) {
        gameOver()
        return
      }

      // Mover = añadir una cabeza nueva (unshift) y quitar la cola (pop).
      // Al comer no quitamos la cola: así la serpiente crece un segmento
      snake.unshift(head)

      if (willEat) {
        score++
        bumpScore()
        food = createFood()
        if (!food) gameOver(true)
      } else {
        snake.pop()
      }
    }

    function gameOver(hasWon = false) {
      state = STATES.OVER

      const isNewRecord = score > record
      if (isNewRecord) {
        record = score
        saveRecord(record)
      }

      updateScoreboard()
      showOverlay({
        title: hasWon ? '¡Has ganado! 🏆' : 'Game over',
        text: `Puntuación: ${score}${isNewRecord ? ' · ¡Nuevo récord! 🎉' : ` · Récord: ${record}`}`,
        button: 'Jugar de nuevo',
        isOver: true
      })
    }

    function startGame() {
      if (state === STATES.OVER) resetGame()
      state = STATES.PLAYING
      hideOverlay()
      $overlayButton.blur()
    }

    function pauseGame() {
      if (state !== STATES.PLAYING) return
      state = STATES.PAUSED
      showOverlay({ title: 'Pausa', text: 'Pulsa espacio para continuar', button: 'Continuar' })
    }

    function togglePause() {
      if (state === STATES.PLAYING) pauseGame()
      else startGame()
    }

    function showOverlay({ title, text, button, isOver = false }) {
      $overlayTitle.textContent = title
      $overlayText.textContent = text
      $overlayButton.textContent = button
      $overlay.classList.toggle('is-over', isOver)
      $overlay.hidden = false
    }

    function hideOverlay() {
      $overlay.hidden = true
    }

    function updateScoreboard() {
      $score.textContent = score
      $record.textContent = Math.max(score, record)
    }

    function bumpScore() {
      updateScoreboard()
      const $box = $score.parentElement
      $box.classList.remove('bump')
      void $box.offsetWidth // forzamos un reflow para reiniciar la animación
      $box.classList.add('bump')
    }

    // GAME LOOP
    // requestAnimationFrame se ejecuta ~60 veces por segundo, pero la
    // serpiente se mueve menos veces. Acumulamos el tiempo transcurrido y
    // damos un paso cada vez que supera la duración de un tick
    function loop(now) {
      const delta = now - lastFrameTime
      lastFrameTime = now

      if (state === STATES.PLAYING) {
        accumulator += delta

        // Si la pestaña estuvo inactiva el delta puede ser enorme:
        // lo limitamos para no dar decenas de pasos de golpe
        accumulator = Math.min(accumulator, 250)

        while (state === STATES.PLAYING && accumulator >= 1000 / getSpeed()) {
          accumulator -= 1000 / getSpeed()
          step()
        }
      }

      draw(now)
      window.requestAnimationFrame(loop)
    }

    // DIBUJO
    function resizeCanvas() {
      // Ajustamos la resolución interna al tamaño real en pantalla y al
      // devicePixelRatio para que se vea nítido en pantallas retina
      const { width } = canvas.getBoundingClientRect()
      const size = Math.round(width * window.devicePixelRatio)
      canvas.width = size
      canvas.height = size
    }

    function draw(now) {
      const cell = canvas.width / COLS

      drawBoard(cell)
      if (food) drawFood(cell, now)
      drawSnake(cell)
    }

    function drawBoard(cell) {
      context.fillStyle = '#0b1222'
      context.fillRect(0, 0, canvas.width, canvas.height)

      context.fillStyle = '#0e1729'
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if ((x + y) % 2 === 0) context.fillRect(x * cell, y * cell, cell, cell)
        }
      }
    }

    function drawFood(cell, now) {
      const pulse = 1 + Math.sin(now / 180) * 0.08
      const centerX = (food.x + 0.5) * cell
      const centerY = (food.y + 0.5) * cell
      const radius = cell * 0.32 * pulse

      context.save()
      context.shadowColor = '#f87171'
      context.shadowBlur = cell * 0.8
      context.fillStyle = '#ef4444'
      context.beginPath()
      context.arc(centerX, centerY, radius, 0, Math.PI * 2)
      context.fill()
      context.restore()

      // hojita
      context.fillStyle = '#4ade80'
      context.beginPath()
      context.ellipse(centerX + radius * 0.35, centerY - radius * 1.05, radius * 0.4, radius * 0.18, -0.6, 0, Math.PI * 2)
      context.fill()
    }

    function drawSnake(cell) {
      const padding = cell * 0.08

      snake.forEach((segment, index) => {
        // Degradado de color de la cabeza a la cola
        const progress = index / Math.max(1, snake.length - 1)
        const lightness = 62 - progress * 22
        context.fillStyle = `hsl(${142 + progress * 30} 72% ${lightness}%)`

        context.beginPath()
        context.roundRect(
          segment.x * cell + padding,
          segment.y * cell + padding,
          cell - padding * 2,
          cell - padding * 2,
          index === 0 ? cell * 0.35 : cell * 0.25
        )
        context.fill()
      })

      drawEyes(cell)
    }

    function drawEyes(cell) {
      const head = snake[0]
      const { x: dx, y: dy } = DIRECTIONS[direction]
      const centerX = (head.x + 0.5) * cell
      const centerY = (head.y + 0.5) * cell

      // Los ojos se colocan hacia delante y separados en perpendicular
      const forward = cell * 0.18
      const side = cell * 0.2

      for (const sign of [-1, 1]) {
        const eyeX = centerX + dx * forward + dy * side * sign
        const eyeY = centerY + dy * forward + dx * side * sign

        context.fillStyle = '#f8fafc'
        context.beginPath()
        context.arc(eyeX, eyeY, cell * 0.11, 0, Math.PI * 2)
        context.fill()

        context.fillStyle = '#020617'
        context.beginPath()
        context.arc(eyeX + dx * cell * 0.04, eyeY + dy * cell * 0.04, cell * 0.055, 0, Math.PI * 2)
        context.fill()
      }
    }

    // CONTROLES
    document.addEventListener('keydown', (event) => {
      const newDirection = KEY_TO_DIRECTION[event.code]

      if (newDirection) {
        event.preventDefault()
        if (state === STATES.PAUSED) return
        if (state !== STATES.PLAYING) startGame()
        queueDirection(newDirection)
        return
      }

      if (event.code === 'Space' || event.code === 'Enter' || event.code === 'KeyP') {
        event.preventDefault()
        togglePause()
      }
    })

    // Swipe en móvil: guardamos dónde empieza el toque y, al soltar,
    // el eje con mayor desplazamiento decide la dirección
    let swipeStart = null

    canvas.addEventListener('pointerdown', (event) => {
      swipeStart = { x: event.clientX, y: event.clientY }
    })

    canvas.addEventListener('pointerup', (event) => {
      if (!swipeStart) return

      const dx = event.clientX - swipeStart.x
      const dy = event.clientY - swipeStart.y
      swipeStart = null

      if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_THRESHOLD) return

      const newDirection = Math.abs(dx) > Math.abs(dy)
        ? (dx > 0 ? 'right' : 'left')
        : (dy > 0 ? 'down' : 'up')

      if (state === STATES.PAUSED) return
      if (state !== STATES.PLAYING) startGame()
      queueDirection(newDirection)
    })

    $overlayButton.addEventListener('click', startGame)

    // Si el usuario cambia de pestaña, pausamos automáticamente
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) pauseGame()
    })

    new ResizeObserver(resizeCanvas).observe(canvas)

    resetGame()
    resizeCanvas()
    window.requestAnimationFrame((now) => {
      lastFrameTime = now
      loop(now)
    })
  </script>
</head>

<body>
  <main>
    <header>
      <h1>🐍 <span>Snake</span></h1>
      <div class="scores">
        <div class="score"><small>Puntos</small><strong id="score">0</strong></div>
        <div class="score"><small>Récord</small><strong id="record">0</strong></div>
      </div>
    </header>

    <div class="board">
      <canvas aria-label="Tablero del juego Snake"></canvas>
      <div class="overlay">
        <div class="card">
          <h2>¿Preparado?</h2>
          <p>Come manzanas para crecer. No choques con las paredes ni contigo misma.</p>
          <button>Empezar</button>
        </div>
      </div>
    </div>

    <p class="hint"><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> o <kbd>WASD</kbd> para moverte ·
      <kbd>Espacio</kbd> pausa · desliza en móvil
    </p>
  </main>
</body>

</html>
